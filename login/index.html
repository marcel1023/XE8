<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <form id="loginForm">   <!-- Tambahkan id ini -->
      <h2>Login</h2>
      
      <div class="input-field">
        <input type="text" id="username" required>   <!-- Tambahkan id -->
        <label>Enter your email / username</label>
      </div>
      
      <div class="input-field">
        <input type="password" id="password" required>   <!-- Tambahkan id -->
        <label>Enter your password</label>
      </div>
      
      <div class="forget">
        <label for="remember">
          <input type="checkbox" id="remember">
          <p>Remember me</p>
        </label>
        <a href="#">Forgot password?</a>
      </div>
      
      <button type="submit">Log In</button>
      
      <div id="alertBox" style="display: none; color: red; margin-top: 10px; text-align: center;"></div>
      
      <div class="register">
        <p>Don't have an account? <a href="#">Register</a></p>
      </div>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
